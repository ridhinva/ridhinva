<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REPO_NAME — Ridhin V A</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc; color: #1e293b; line-height: 1.7;
    }
    body.dark { background: #0f172a; color: #f1f5f9; }
    .container { max-width: 880px; margin: auto; padding: 48px 24px; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: #64748b; text-decoration: none; font-size: 13px; font-weight: 500;
      margin-bottom: 24px; transition: color 0.2s;
    }
    .back:hover { color: #2563eb; }
    .repo-header { margin-bottom: 32px; }
    .repo-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .repo-header .links { margin-top: 8px; display: flex; gap: 12px; }
    .repo-header .links a {
      color: #2563eb; text-decoration: none; font-size: 13px; font-weight: 500;
    }
    .repo-header .links a:hover { text-decoration: underline; }
    #readme h1 { font-size: 24px; margin-bottom: 12px; }
    #readme h2 { font-size: 18px; margin: 28px 0 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
    #readme h3 { font-size: 16px; margin: 20px 0 6px; }
    body.dark #readme h2 { border-color: #334155; }
    #readme p { margin-bottom: 12px; color: #475569; }
    body.dark #readme p { color: #94a3b8; }
    #readme code {
      background: #f1f5f9; padding: 1px 6px; border-radius: 4px;
      font-size: 13px; font-family: 'JetBrains Mono', monospace;
    }
    body.dark #readme code { background: #1e293b; }
    #readme pre {
      background: #f1f5f9; padding: 16px; border-radius: 8px;
      overflow-x: auto; font-size: 13px; margin: 12px 0;
      border: 1px solid #e2e8f0;
    }
    body.dark #readme pre { background: #1e293b; border-color: #334155; }
    #readme pre code { background: none; padding: 0; }
    #readme a { color: #2563eb; }
    #readme img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
    #readme hr { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0; }
    body.dark #readme hr { border-color: #334155; }
    #readme table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    #readme th, #readme td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; font-size: 13px; }
    body.dark #readme th, body.dark #readme td { border-color: #334155; }
    #readme th { background: #f8fafc; font-weight: 600; }
    body.dark #readme th { background: #1e293b; }
    #readme ul, #readme ol { padding-left: 24px; margin-bottom: 12px; color: #475569; }
    body.dark #readme ul, body.dark #readme ol { color: #94a3b8; }
    #readme li { margin-bottom: 4px; }
    #readme blockquote {
      border-left: 3px solid #2563eb; padding-left: 16px;
      color: #64748b; margin: 12px 0; font-style: italic;
    }
    .loading { text-align: center; padding: 60px; color: #94a3b8; font-size: 14px; }
    .error { text-align: center; padding: 60px; color: #dc2626; }
    .theme-toggle {
      position: fixed; top: 16px; right: 24px; z-index: 100;
      background: #fff; border: 1px solid #e2e8f0; color: #1e293b;
      padding: 8px 14px; font-size: 16px; cursor: pointer;
      border-radius: 8px; transition: all 0.2s;
    }
    body.dark .theme-toggle { background: #1e293b; border-color: #334155; color: #f1f5f9; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="container">
    <a class="back" href="https://ridhinva.github.io/ridhinva/">← Back to portfolio</a>
    <div class="repo-header">
      <h1 id="repoName">Loading...</h1>
      <div class="links">
        <a id="githubLink" href="#" target="_blank">View on GitHub →</a>
        <a id="starsBadge" href="#" target="_blank" style="color:#64748b;"></a>
      </div>
    </div>
    <div id="readme"><div class="loading">⏳ Loading README...</div></div>
  </div>
  <script>
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️';
    }

    const repoFull = "ridhinva/Cloud-Security-Toolkit";  // e.g., "ridhinva/CVE-2026-9082"
    const repoName = repoFull.split('/')[1];
    document.getElementById('repoName').textContent = repoName;
    document.getElementById('githubLink').href = `https://github.com/${repoFull}`;

    // Fetch repo info
    fetch(`https://api.github.com/repos/${repoFull}`)
      .then(r => r.json())
      .then(d => {
        const badge = document.getElementById('starsBadge');
        if (d.stargazers_count !== undefined) {
          badge.textContent = `⭐ ${d.stargazers_count} stars  |  ${d.forks_count} forks`;
          badge.href = `https://github.com/${repoFull}/stargazers`;
        }
      }).catch(() => {});

    // Fetch README
    fetch(`https://api.github.com/repos/${repoFull}/readme`, {
      headers: { 'Accept': 'application/vnd.github.v3.raw' }
    })
      .then(r => { if (!r.ok) throw Error('No README'); return r.text(); })
      .then(md => {
        let html = md
          .replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c])
          .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/###### (.*)/g, '<h6>$1</h6>')
          .replace(/##### (.*)/g, '<h5>$1</h5>')
          .replace(/#### (.*)/g, '<h4>$1</h4>')
          .replace(/### (.*)/g, '<h3>$1</h3>')
          .replace(/## (.*)/g, '<h2>$1</h2>')
          .replace(/# (.*)/g, '<h1>$1</h1>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/^- (.*)/gm, '<li>$1</li>')
          .replace(/^(\d+)\. (.*)/gm, '<li>$1. $2</li>')
          .replace(/^> (.*)/gm, '<blockquote>$1</blockquote>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        document.getElementById('readme').innerHTML = '<p>' + html + '</p>';
      })
      .catch(() => {
        document.getElementById('readme').innerHTML = '<div class="error">❌ Could not load README. <a href="https://github.com/' + repoFull + '" target="_blank">View on GitHub →</a></div>';
      });
  </script>
</body>
</html>
